name: Auto Commit

# Define a programação para a execução (a cada hora neste exemplo)
on:
  schedule:
    - cron: '0 * * * *'  # A cada hora (UTC)

# Definindo os jobs que o GitHub Actions vai rodar
jobs:
  commit:
    runs-on: ubuntu-latest  # Vai rodar no Ubuntu, mas pode ser no Windows também

    steps:
      # Passo 1: Pegar o código
      - name: Checkout code
        uses: actions/checkout@v3

      # Passo 2: Criar um arquivo com a data atual (atividade)
      - name: Create file with timestamp
        run: echo "Atividade automática gerada em $(date)" > atividade.txt

      # Passo 3: Configurar git
      - name: Configurar git
        run: |
          git config --global user.name "shashibukay"
          git config --global user.email "zwirtesff@gmail.com"

      # Passo 4: Verificar alterações antes de fazer o commit
      - name: Check for changes before commit
        run: |
          git diff --exit-code || git commit -m "Atividade automática $(date)"

      # Passo 5: Enviar para o repositório remoto
      - name: Push changes
        run: git push origin main  # ou master, se o ramo remoto for master
